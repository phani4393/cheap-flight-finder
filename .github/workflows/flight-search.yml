name: Cheap Flight Search

on:
  schedule:
    # Run 3x daily: 6am, 12pm, 6pm CT (UTC-5 → 11:00, 17:00, 23:00 UTC)
    - cron: '0 11 * * *'
    - cron: '0 17 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  search-flights:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create results directory
        run: mkdir -p results

      # ===== SEARCH PROFILE A: Family Round-Trip (3-4 days) =====
      - name: "Search: Family round-trip (3-4 days, under $200)"
        id: family
        continue-on-error: true
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          TIME=$(date +%H%M)
          FILENAME="results/family_${DATE}_${TIME}.csv"
          
          node dist/cli.js \
            --backend rapidapi \
            --from BOTH \
            --round-trip \
            --return-days 3-4 \
            --max-price 200 \
            --adults 2 \
            --limit 15 \
            --export "$FILENAME" 2>&1 | tee family_output.txt
          
          if [ -f "$FILENAME" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "filename=$FILENAME" >> $GITHUB_OUTPUT
            FLIGHT_COUNT=$(wc -l < "$FILENAME")
            FLIGHT_COUNT=$((FLIGHT_COUNT - 1))
            echo "count=$FLIGHT_COUNT" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      # ===== SEARCH PROFILE B: Weekend Getaway (Fri-Mon) =====
      - name: "Search: Weekend getaway (nonstop, under $150)"
        id: weekend
        continue-on-error: true
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          TIME=$(date +%H%M)
          FILENAME="results/weekend_${DATE}_${TIME}.csv"
          
          # Find next Friday
          NEXT_FRI=$(date -d "next friday" +%Y-%m-%d 2>/dev/null || date -d "friday" +%Y-%m-%d)
          NEXT_FRI_PLUS2=$(date -d "$NEXT_FRI + 14 days" +%Y-%m-%d 2>/dev/null || date -d "friday + 14 days" +%Y-%m-%d)
          
          node dist/cli.js \
            --backend rapidapi \
            --from BOTH \
            --round-trip \
            --return-days 2-3 \
            --nonstop \
            --max-price 150 \
            --adults 2 \
            --date-from "$NEXT_FRI" \
            --date-to "$NEXT_FRI_PLUS2" \
            --limit 10 \
            --export "$FILENAME" 2>&1 | tee weekend_output.txt
          
          if [ -f "$FILENAME" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "filename=$FILENAME" >> $GITHUB_OUTPUT
            FLIGHT_COUNT=$(wc -l < "$FILENAME")
            FLIGHT_COUNT=$((FLIGHT_COUNT - 1))
            echo "count=$FLIGHT_COUNT" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      # ===== SEARCH PROFILE C: Ultra-cheap one-way deals =====
      - name: "Search: Ultra-cheap one-way (under $60, nonstop)"
        id: budget
        continue-on-error: true
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          TIME=$(date +%H%M)
          FILENAME="results/budget_${DATE}_${TIME}.csv"
          
          node dist/cli.js \
            --backend rapidapi \
            --from BOTH \
            --nonstop \
            --max-price 60 \
            --limit 10 \
            --export "$FILENAME" 2>&1 | tee budget_output.txt
          
          if [ -f "$FILENAME" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "filename=$FILENAME" >> $GITHUB_OUTPUT
            FLIGHT_COUNT=$(wc -l < "$FILENAME")
            FLIGHT_COUNT=$((FLIGHT_COUNT - 1))
            echo "count=$FLIGHT_COUNT" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      # ===== PRICE DROP DETECTION =====
      - name: Detect price drops
        id: pricedrops
        if: steps.family.outputs.status == 'success'
        run: |
          CURRENT_FILE="${{ steps.family.outputs.filename }}"
          
          # Find yesterday's family search file
          YESTERDAY=$(date -d "yesterday" +%Y-%m-%d 2>/dev/null || date -d "-1 day" +%Y-%m-%d)
          PREV_FILE=$(ls results/family_${YESTERDAY}_*.csv 2>/dev/null | head -1)
          
          if [ -z "$PREV_FILE" ] || [ ! -f "$PREV_FILE" ]; then
            echo "drops=none" >> $GITHUB_OUTPUT
            echo "No previous data to compare."
            exit 0
          fi
          
          # Compare routes: find routes where price dropped 20%+
          DROPS=""
          while IFS=',' read -r price origin dest rest; do
            # Skip header
            [ "$price" = "price" ] && continue
            
            # Find same route in previous file
            PREV_PRICE=$(grep ",$origin,$dest," "$PREV_FILE" | head -1 | cut -d',' -f1)
            
            if [ -n "$PREV_PRICE" ] && [ "$PREV_PRICE" -gt 0 ] 2>/dev/null; then
              # Calculate drop percentage
              DROP_PCT=$(( (PREV_PRICE - price) * 100 / PREV_PRICE ))
              if [ "$DROP_PCT" -ge 20 ]; then
                DROPS="${DROPS}📉 ${origin}→${dest}: \$${PREV_PRICE}→\$${price} (-${DROP_PCT}%)%0A"
              fi
            fi
          done < "$CURRENT_FILE"
          
          if [ -n "$DROPS" ]; then
            echo "drops=found" >> $GITHUB_OUTPUT
            echo "$DROPS" > price_drops.txt
          else
            echo "drops=none" >> $GITHUB_OUTPUT
          fi

      # ===== COMMIT RESULTS =====
      - name: Commit results
        if: steps.family.outputs.status == 'success' || steps.weekend.outputs.status == 'success' || steps.budget.outputs.status == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "data: flight search results $(date +%Y-%m-%d %H:%M)"
          git push

      # ===== TELEGRAM NOTIFICATION =====
      - name: Send Telegram notification
        if: (steps.family.outputs.status == 'success' || steps.weekend.outputs.status == 'success' || steps.budget.outputs.status == 'success') && env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE=""
          
          # --- PRICE DROPS (highest priority) ---
          if [ -f price_drops.txt ]; then
            DROPS=$(cat price_drops.txt)
            MESSAGE+="🚨 *PRICE DROPS DETECTED!*%0A${DROPS}%0A"
          fi
          
          # --- FAMILY ROUND-TRIP DEALS ---
          FAMILY_COUNT="${{ steps.family.outputs.count }}"
          if [ "$FAMILY_COUNT" -gt "0" ] 2>/dev/null; then
            MESSAGE+="👨‍👩‍👧 *Family Trips (3-4 days, round-trip)*%0A"
            
            FILENAME="${{ steps.family.outputs.filename }}"
            if [ -f "$FILENAME" ]; then
              tail -n +2 "$FILENAME" | sort -t',' -k1 -n | head -3 | while IFS=',' read -r price origin dest dep_date dep_time arr_time airline duration stops url; do
                # Deal score based on price
                if [ "$price" -le 100 ] 2>/dev/null; then
                  SCORE="🔥🔥🔥"
                elif [ "$price" -le 150 ] 2>/dev/null; then
                  SCORE="🔥🔥"
                else
                  SCORE="🔥"
                fi
                echo "${SCORE} \$${price} ${origin}→${dest} ${dep_date} (${airline})"
              done > family_msg.txt
              MESSAGE+="$(cat family_msg.txt)%0A%0A"
            fi
          fi
          
          # --- WEEKEND GETAWAY DEALS ---
          WEEKEND_COUNT="${{ steps.weekend.outputs.count }}"
          if [ "$WEEKEND_COUNT" -gt "0" ] 2>/dev/null; then
            MESSAGE+="🏖️ *Weekend Getaways (nonstop)*%0A"
            
            FILENAME="${{ steps.weekend.outputs.filename }}"
            if [ -f "$FILENAME" ]; then
              tail -n +2 "$FILENAME" | sort -t',' -k1 -n | head -3 | while IFS=',' read -r price origin dest dep_date dep_time arr_time airline duration stops url; do
                if [ "$price" -le 80 ] 2>/dev/null; then
                  SCORE="🔥🔥🔥"
                elif [ "$price" -le 120 ] 2>/dev/null; then
                  SCORE="🔥🔥"
                else
                  SCORE="🔥"
                fi
                echo "${SCORE} \$${price} ${origin}→${dest} ${dep_date} (${airline})"
              done > weekend_msg.txt
              MESSAGE+="$(cat weekend_msg.txt)%0A%0A"
            fi
          fi
          
          # --- ULTRA-CHEAP DEALS ---
          BUDGET_COUNT="${{ steps.budget.outputs.count }}"
          if [ "$BUDGET_COUNT" -gt "0" ] 2>/dev/null; then
            MESSAGE+="💸 *Ultra-Cheap (under \$60, one-way)*%0A"
            
            FILENAME="${{ steps.budget.outputs.filename }}"
            if [ -f "$FILENAME" ]; then
              tail -n +2 "$FILENAME" | sort -t',' -k1 -n | head -3 | while IFS=',' read -r price origin dest dep_date dep_time arr_time airline duration stops url; do
                echo "🔥🔥🔥 \$${price} ${origin}→${dest} ${dep_date} (${airline})"
              done > budget_msg.txt
              MESSAGE+="$(cat budget_msg.txt)%0A%0A"
            fi
          fi
          
          # --- SUMMARY ---
          if [ -z "$MESSAGE" ]; then
            MESSAGE="✈️ No cheap flights found this run. Will check again later."
          else
            MESSAGE="✈️ *Flight Deals Report*%0A━━━━━━━━━━━━━━━━━━%0A%0A${MESSAGE}"
            MESSAGE+="🔗 [Full results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi
          
          # Send to Telegram
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="${MESSAGE}" \
            -d disable_web_page_preview=true
