name: Cheap Flight Search

on:
  schedule:
    # Run 3x daily at different hours to spread API usage
    # Each run executes only ONE search profile to stay within rate limits
    - cron: '0 11 * * *'   # 6am CT → family search
    - cron: '0 17 * * *'   # 12pm CT → weekend search
    - cron: '0 23 * * *'   # 6pm CT → budget search
  workflow_dispatch:
    inputs:
      profile:
        description: 'Search profile to run (family, weekend, budget, or all)'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  search-flights:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create results directory
        run: mkdir -p results

      - name: Determine which profile to run
        id: profile
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=${{ github.event.inputs.profile || 'all' }}" >> $GITHUB_OUTPUT
          else
            # Determine profile based on cron schedule (hour of trigger)
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "11" ]; then
              echo "run=family" >> $GITHUB_OUTPUT
            elif [ "$HOUR" = "17" ]; then
              echo "run=weekend" >> $GITHUB_OUTPUT
            else
              echo "run=budget" >> $GITHUB_OUTPUT
            fi
          fi

      # ===== SEARCH PROFILE A: Family Round-Trip (3-5 days) =====
      - name: "Search: Family round-trip (3-5 days, under $300)"
        id: family
        if: steps.profile.outputs.run == 'family' || steps.profile.outputs.run == 'all'
        continue-on-error: true
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          TIME=$(date +%H%M)
          FILENAME="results/family_${DATE}_${TIME}.csv"
          
          node dist/cli.js \
            --from BOTH \
            --round-trip \
            --return-days 3-5 \
            --max-price 300 \
            --adults 2 \
            --limit 15 \
            --export "$FILENAME" 2>&1 | tee family_output.txt
          
          if [ -f "$FILENAME" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "filename=$FILENAME" >> $GITHUB_OUTPUT
            FLIGHT_COUNT=$(wc -l < "$FILENAME")
            FLIGHT_COUNT=$((FLIGHT_COUNT - 1))
            echo "count=$FLIGHT_COUNT" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      # ===== SEARCH PROFILE B: Weekend Getaway (Fri-Mon) =====
      - name: "Search: Weekend getaway (under $250)"
        id: weekend
        if: steps.profile.outputs.run == 'weekend' || steps.profile.outputs.run == 'all'
        continue-on-error: true
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          TIME=$(date +%H%M)
          FILENAME="results/weekend_${DATE}_${TIME}.csv"
          
          # Find next Friday
          NEXT_FRI=$(date -d "next friday" +%Y-%m-%d 2>/dev/null || date -d "friday" +%Y-%m-%d)
          NEXT_FRI_PLUS2=$(date -d "$NEXT_FRI + 14 days" +%Y-%m-%d 2>/dev/null || date -d "friday + 14 days" +%Y-%m-%d)
          
          node dist/cli.js \
            --from BOTH \
            --round-trip \
            --return-days 2-3 \
            --max-price 250 \
            --adults 2 \
            --date-from "$NEXT_FRI" \
            --date-to "$NEXT_FRI_PLUS2" \
            --limit 10 \
            --export "$FILENAME" 2>&1 | tee weekend_output.txt
          
          if [ -f "$FILENAME" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "filename=$FILENAME" >> $GITHUB_OUTPUT
            FLIGHT_COUNT=$(wc -l < "$FILENAME")
            FLIGHT_COUNT=$((FLIGHT_COUNT - 1))
            echo "count=$FLIGHT_COUNT" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      # ===== SEARCH PROFILE C: Cheap one-way deals =====
      - name: "Search: Cheap one-way (under $120)"
        id: budget
        if: steps.profile.outputs.run == 'budget' || steps.profile.outputs.run == 'all'
        continue-on-error: true
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          TIME=$(date +%H%M)
          FILENAME="results/budget_${DATE}_${TIME}.csv"
          
          node dist/cli.js \
            --from BOTH \
            --max-price 120 \
            --limit 10 \
            --export "$FILENAME" 2>&1 | tee budget_output.txt
          
          if [ -f "$FILENAME" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "filename=$FILENAME" >> $GITHUB_OUTPUT
            FLIGHT_COUNT=$(wc -l < "$FILENAME")
            FLIGHT_COUNT=$((FLIGHT_COUNT - 1))
            echo "count=$FLIGHT_COUNT" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      # ===== PRICE DROP DETECTION =====
      - name: Detect price drops
        id: pricedrops
        if: steps.family.outputs.status == 'success'
        run: |
          node scripts/detect-price-drops.cjs \
            --current "${{ steps.family.outputs.filename }}" \
            --profile family \
            --output price_drops.txt
          
          if [ -s price_drops.txt ]; then
            echo "drops=found" >> $GITHUB_OUTPUT
          else
            echo "drops=none" >> $GITHUB_OUTPUT
          fi

      # ===== COMMIT RESULTS =====
      - name: Commit results
        if: steps.family.outputs.status == 'success' || steps.weekend.outputs.status == 'success' || steps.budget.outputs.status == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "data: flight search results $(date +%Y-%m-%d %H:%M)"
          git push

      # ===== TELEGRAM NOTIFICATION =====
      - name: Send Telegram notification
        if: (steps.family.outputs.status == 'success' || steps.weekend.outputs.status == 'success' || steps.budget.outputs.status == 'success') && env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE=$(node scripts/format-telegram.cjs \
            --family "${{ steps.family.outputs.filename }}" \
            --weekend "${{ steps.weekend.outputs.filename }}" \
            --budget "${{ steps.budget.outputs.filename }}" \
            --drops "price_drops.txt" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode "text=${MESSAGE}" \
            -d disable_web_page_preview=true
