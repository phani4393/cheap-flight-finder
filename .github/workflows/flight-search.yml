name: Cheap Flight Search

on:
  schedule:
    # Run 3x daily: 6am, 12pm, 6pm CT (UTC-5 → 11:00, 17:00, 23:00 UTC)
    - cron: '0 11 * * *'
    - cron: '0 17 * * *'
    - cron: '0 23 * * *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  search-flights:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create results directory
        run: mkdir -p results

      - name: Search flights (RapidAPI backend)
        id: search
        continue-on-error: true
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          TIME=$(date +%H%M)
          FILENAME="results/flights_${DATE}_${TIME}.csv"
          
          node dist/cli.js \
            --backend rapidapi \
            --from BOTH \
            --nonstop \
            --limit 20 \
            --export "$FILENAME" 2>&1 | tee search_output.txt
          
          if [ -f "$FILENAME" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "filename=$FILENAME" >> $GITHUB_OUTPUT
            FLIGHT_COUNT=$(wc -l < "$FILENAME")
            FLIGHT_COUNT=$((FLIGHT_COUNT - 1))  # subtract header row
            echo "count=$FLIGHT_COUNT" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      - name: Display results summary
        if: always()
        run: |
          echo "## ✈️ Flight Search Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f search_output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat search_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No results found or search failed." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit results
        if: steps.search.outputs.status == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "data: flight search results $(date +%Y-%m-%d %H:%M)"
          git push

      - name: Send Telegram notification
        if: steps.search.outputs.status == 'success' && env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Build message from search output
          COUNT="${{ steps.search.outputs.count }}"
          
          if [ "$COUNT" -gt "0" ] 2>/dev/null; then
            # Extract top 5 cheapest from the output
            MESSAGE="✈️ *Cheap Flights Found!*%0A%0A"
            MESSAGE+="Found *${COUNT}* flights under budget.%0A%0A"
            
            # Parse CSV for top deals (skip header, show top 5)
            FILENAME="${{ steps.search.outputs.filename }}"
            if [ -f "$FILENAME" ]; then
              TOP_DEALS=$(tail -n +2 "$FILENAME" | sort -t',' -k1 -n | head -5 | while IFS=',' read -r price origin dest dep_date dep_time arr_time airline duration stops url; do
                echo "💰 \$${price} ${origin}→${dest} ${dep_date} ${dep_time} (${airline})"
              done)
              MESSAGE+="${TOP_DEALS}%0A%0A"
            fi
            
            MESSAGE+="🔗 [View all results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            
            # Send to Telegram
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d parse_mode="Markdown" \
              -d text="${MESSAGE}" \
              -d disable_web_page_preview=true
          else
            # No flights found - only notify if you want
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d text="✈️ No cheap flights found this run. Will check again later."
          fi
