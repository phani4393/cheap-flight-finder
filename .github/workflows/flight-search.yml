name: Cheap Flight Search

on:
  schedule:
    # Weekdays only at 12pm CT (17:00 UTC) — ~22 calls/month, leaves 28 for manual use
    - cron: '0 17 * * 1-5'
  workflow_dispatch:  # Manual trigger anytime

permissions:
  contents: write

jobs:
  search-flights:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create results directory
        run: mkdir -p results

      # Single daily search: 1 origin → 1 destination, alternating trip type
      # API budget: 1 call/day × 30 days = 30 calls/month (well within 50 limit)
      - name: "Search: Daily flight deal"
        id: search
        continue-on-error: true
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          TIME=$(date +%H%M)
          
          # Rotate destination daily (7 popular US cities from Chicago)
          DESTINATIONS=("LAX" "MIA" "LAS" "DEN" "MCO" "ATL" "FLL")
          DAY_OF_YEAR=$(date +%j)
          IDX=$((DAY_OF_YEAR % 7))
          DEST=${DESTINATIONS[$IDX]}
          
          # Alternate origin: even days = ORD, odd days = MDW
          if [ $((DAY_OF_YEAR % 2)) -eq 0 ]; then
            ORIGIN="ORD"
          else
            ORIGIN="MDW"
          fi
          
          # Alternate trip type: even days = round-trip, odd days = one-way
          DAY_OF_MONTH=$(date +%d)
          if [ $((DAY_OF_MONTH % 2)) -eq 0 ]; then
            TRIP_TYPE="round"
            FILENAME="results/family_${DATE}_${TIME}.csv"
            
            node dist/cli.js \
              --from "$ORIGIN" \
              --destination "$DEST" \
              --round-trip \
              --return-days 3-5 \
              --max-price 300 \
              --date "$DATE" \
              --limit 10 \
              --export "$FILENAME" 2>&1 | tee search_output.txt
          else
            TRIP_TYPE="oneway"
            FILENAME="results/budget_${DATE}_${TIME}.csv"
            
            node dist/cli.js \
              --from "$ORIGIN" \
              --destination "$DEST" \
              --max-price 150 \
              --date "$DATE" \
              --limit 10 \
              --export "$FILENAME" 2>&1 | tee search_output.txt
          fi
          
          echo "origin=$ORIGIN" >> $GITHUB_OUTPUT
          echo "dest=$DEST" >> $GITHUB_OUTPUT
          echo "trip=$TRIP_TYPE" >> $GITHUB_OUTPUT
          
          if [ -f "$FILENAME" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "filename=$FILENAME" >> $GITHUB_OUTPUT
            FLIGHT_COUNT=$(wc -l < "$FILENAME")
            FLIGHT_COUNT=$((FLIGHT_COUNT - 1))
            echo "count=$FLIGHT_COUNT" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "count=0" >> $GITHUB_OUTPUT
          fi

      # ===== COMMIT RESULTS =====
      - name: Commit results
        if: steps.search.outputs.status == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "data: ${{ steps.search.outputs.origin }}→${{ steps.search.outputs.dest }} (${{ steps.search.outputs.trip }}) $(date +%Y-%m-%d)"
          git push

      # ===== TELEGRAM NOTIFICATION =====
      - name: Send Telegram notification
        if: steps.search.outputs.status == 'success' && steps.search.outputs.count != '0' && env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COUNT=${{ steps.search.outputs.count }}
          ORIGIN=${{ steps.search.outputs.origin }}
          DEST=${{ steps.search.outputs.dest }}
          TRIP=${{ steps.search.outputs.trip }}
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          if [ "$TRIP" = "round" ]; then
            TRIP_LABEL="round-trip"
            PRICE_LABEL="under \$300"
          else
            TRIP_LABEL="one-way"
            PRICE_LABEL="under \$150"
          fi
          
          MESSAGE="✈️ *${COUNT} cheap flights found!*
          
${ORIGIN} → ${DEST} (${TRIP_LABEL}, ${PRICE_LABEL})

📋 [View results](${RUN_URL})"
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode "text=${MESSAGE}" \
            -d disable_web_page_preview=true

      - name: Send no-results notification
        if: steps.search.outputs.status == 'success' && steps.search.outputs.count == '0' && env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ORIGIN=${{ steps.search.outputs.origin }}
          DEST=${{ steps.search.outputs.dest }}
          TRIP=${{ steps.search.outputs.trip }}
          
          MESSAGE="✈️ No deals today: ${ORIGIN}→${DEST} (${TRIP}). Will check another route tomorrow."
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}"
