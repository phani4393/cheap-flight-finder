name: ChicaGoWhere - Family Flight Deals

# Twice weekly: Tuesday and Friday evenings (good times to catch weekend/week deals)
# Tuesday 7pm CT = Wednesday 1am UTC
# Friday 7pm CT = Saturday 1am UTC
on:
  schedule:
    - cron: '0 1 * * 3'  # Wednesday 1am UTC (Tuesday 7pm CT)
    - cron: '0 1 * * 6'  # Saturday 1am UTC (Friday 7pm CT)
  workflow_dispatch:
    inputs:
      destination:
        description: 'Specific destination (SEA, PDX, SLC, LAS) or ALL'
        required: false
        default: 'ALL'

permissions:
  contents: write

env:
  # ChicaGoWhere destinations: Seattle, Portland, Salt Lake City, Vegas
  DESTINATIONS: "SEA PDX SLC LAS"
  MAX_PRICE: 200
  RETURN_DAYS: "2-4"

jobs:
  search-deals:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create results directory
        run: mkdir -p results

      - name: Search all destinations
        id: search
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          DATE=$(date +%Y-%m-%d)
          TIME=$(date +%H%M)
          CSV_FILES=""
          
          # Determine which destinations to search
          if [ "${{ github.event.inputs.destination }}" != "" ] && [ "${{ github.event.inputs.destination }}" != "ALL" ]; then
            SEARCH_DESTS="${{ github.event.inputs.destination }}"
          else
            SEARCH_DESTS="${DESTINATIONS}"
          fi
          
          for DEST in $SEARCH_DESTS; do
            echo "🔍 Searching ORD/MDW → $DEST..."
            FILENAME="results/chicagowhere_${DEST}_${DATE}_${TIME}.csv"
            
            # Search with higher max price to always find something, then filter locally
            node dist/cli.js \
              --from BOTH \
              --destination "$DEST" \
              --round-trip \
              --return-days ${RETURN_DAYS} \
              --max-price 500 \
              --limit 10 \
              --export "$FILENAME" 2>&1 || true
            
            if [ -f "$FILENAME" ]; then
              CSV_FILES="$CSV_FILES $FILENAME"
            fi
            
            # Small delay between destinations to be nice to the API
            sleep 2
          done
          
          echo "csv_files=$CSV_FILES" >> $GITHUB_OUTPUT

      - name: Analyze results
        id: analyze
        env:
          MAX_PRICE: ${{ env.MAX_PRICE }}
        run: |
          CSV_FILES="${{ steps.search.outputs.csv_files }}"
          
          if [ -z "$CSV_FILES" ]; then
            echo "No CSV files to analyze"
            echo "status=no_results" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Run analyzer script
          ANALYSIS=$(node scripts/chicagowhere-analyze.js $CSV_FILES)
          
          # Extract values from JSON output
          TOTAL_DEALS=$(echo "$ANALYSIS" | jq -r '.summary.dealsFound')
          MESSAGE=$(echo "$ANALYSIS" | jq -r '.message')
          BOOKING_LINKS=$(echo "$ANALYSIS" | jq -r '.bookingLinks // empty')
          
          # Save message to file (for multiline output)
          echo "$MESSAGE" > /tmp/telegram_message.txt
          if [ -n "$BOOKING_LINKS" ]; then
            echo "" >> /tmp/telegram_message.txt
            echo "$BOOKING_LINKS" >> /tmp/telegram_message.txt
          fi
          
          echo "total_deals=$TOTAL_DEALS" >> $GITHUB_OUTPUT
          
          if [ "$TOTAL_DEALS" -gt 0 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=no_deals" >> $GITHUB_OUTPUT
          fi

      - name: Commit results
        if: steps.analyze.outputs.status == 'success' || steps.analyze.outputs.status == 'no_deals'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/ data/
          git diff --cached --quiet || git commit -m "chicagowhere: ${{ steps.analyze.outputs.total_deals }} deals under \$${MAX_PRICE} $(date +%Y-%m-%d)"
          git push

      - name: Send Telegram alert
        if: (steps.analyze.outputs.status == 'success' || steps.analyze.outputs.status == 'no_deals') && env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MESSAGE=$(cat /tmp/telegram_message.txt)
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          # Append view link
          MESSAGE="${MESSAGE}

📋 [View run details](${RUN_URL})"
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="Markdown" \
            --data-urlencode "text=${MESSAGE}" \
            -d disable_web_page_preview=true
